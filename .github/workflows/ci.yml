name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows release
        run: cargo build --locked --release -p victory
      - name: Inspect release output and Windows imports
        shell: pwsh
        run: |
          Get-ChildItem target/release -File | Select-Object Name, Length
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $dumpbin = & $vswhere -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw 'Visual Studio dumpbin.exe was not found; cannot record the executable import table.' }
          & $dumpbin /dependents target/release/victory.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect victory.exe imports.' }
      - name: Stage Windows release package
        shell: pwsh
        run: |
          $package = 'dist/VI-BR-PORT-windows-x86_64-msvc'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item target/release/victory.exe $package/
          $redistRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Redist/D3D'
          $d3dcompiler = Get-ChildItem $redistRoot -Filter d3dcompiler_47.dll -Recurse -File |
            Where-Object { $_.FullName -match '\\x64\\d3dcompiler_47\.dll$' } |
            Select-Object -First 1
          if (-not $d3dcompiler) { throw 'Windows SDK x64 d3dcompiler_47.dll redistributable was not found.' }
          Copy-Item $d3dcompiler.FullName $package/
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          $vcRuntime = Get-ChildItem (Join-Path $vsPath 'VC/Redist/MSVC') -Filter vcruntime140.dll -Recurse -File |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC[^\\]+\\vcruntime140\.dll
          Copy-Item victory.example.toml $package/
          Copy-Item LICENSE $package/
          Copy-Item README.md $package/
          Get-ChildItem $package -File | Select-Object Name, Length
      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: VI-BR-PORT-windows-x86_64-msvc
          path: dist/VI-BR-PORT-windows-x86_64-msvc/
          if-no-files-found: error
          retention-days: 14
 } |
            Select-Object -First 1
          if (-not $vcRuntime) { throw 'Visual C++ x64 vcruntime140.dll redistributable was not found.' }
          Copy-Item $vcRuntime.FullName $package/
          Copy-Item victory.example.toml $package/
          Copy-Item LICENSE $package/
          Copy-Item README.md $package/
          Get-ChildItem $package -File | Select-Object Name, Length
      - name: Upload Windows release package
        uses: actions/upload-artifact@v4
        with:
          name: VI-BR-PORT-windows-x86_64-msvc
          path: dist/VI-BR-PORT-windows-x86_64-msvc/
          if-no-files-found: error
          retention-days: 14
